# syntax=ghcr.io/broadsage/doko:latest

name: Nginx stable
image: ghcr.io/broadsage/doko/nginx
variant: runtime
timeout-seconds: 120
tags:
  - latest
  - "1.26"
  - "1.26.3"
  - 1.26-alpine
  - 1.26-alpine3.23
  - 1.26.3-alpine
  - 1.26.3-alpine3.23
platforms:
  - linux/arm64
dates:
  release: "2026-07-16"
  end-of-life: "2027-07-16"

vars:
  NGINX_VERSION: "1.26.3"
  NGINX_PKG: "nginx"
  PKG_RELEASE: "r0"

environment:
  LANGUAGE: "en_US:en"
  NGINX_VERSION: "${NGINX_VERSION}"

annotations:
  org.opencontainers.image.title: "Nginx stable"
  org.opencontainers.image.description: "Hardened Nginx web server built with Doko"
  org.opencontainers.image.url: "https://github.com/broadsage/doko"
  org.opencontainers.image.source: "https://github.com/broadsage/doko"
  org.opencontainers.image.version: "${NGINX_VERSION}"
  org.opencontainers.image.authors: "Broadsage Corporation <opensource@broadsage.com>"

os-release:
  name: Broadsage Secured Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Broadsage Secured Images/Alpine Linux v3.23
  home-url: https://broadsage.com/products/secured-images/
  bug-report-url: https://broadsage.com/support/

security:
  policy:
    fail-on-cve: high
  profiles:
    - seccomp
    - landlock

builds:
  - name: config-builder
    outputs:
      - source: /var/www/html/index.html
        target: /var/www/html/index.html
    contents:
      packages:
        - curl
      paths:
        - type: directory
          path: /var/www/html
          uid: 65532
          gid: 65532
          mode: "0755"
      pipeline:
        - name: setup-web-root
          runs: |
            echo "<h1>Hello from Doko Hardened Nginx</h1>" > /var/www/html/index.html

contents:
  packages:
    - ${NGINX_PKG}
    - curl
  paths:
    - type: directory
      path: /var/www/html
      uid: 65532
      gid: 65532
      mode: "0755"
    - type: directory
      path: /run/nginx
      uid: 65532
      gid: 65532
      mode: "0755"
    - type: directory
      path: /var/lib/nginx
      uid: 65532
      gid: 65532
      mode: "0755"
    - type: directory
      path: /var/log/nginx
      uid: 65532
      gid: 65532
      mode: "0755"
  pipeline:
    - name: configure-nginx-vhost
      runs: |
        cat << 'EOF' > /etc/nginx/http.d/default.conf
        server {
          listen 8080 default_server;
          listen [::]:8080 default_server;

          root /var/www/html;
          index index.html;

          location / {
            try_files $uri $uri/ =404;
          }
        }
        EOF
    - name: configure-nginx-logs
      runs: |
        ln -sf /dev/stdout /var/log/nginx/access.log
        ln -sf /dev/stderr /var/log/nginx/error.log

entrypoint: ["nginx", "-g", "daemon off;"]

runtime:
  ports:
    - 8080

accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
