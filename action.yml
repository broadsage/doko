name: 'Doko Secure Builder'
description: 'Build OCI images declaratively using Doko with built-in vulnerability scans, license compliance gates, and sandbox profile synthesis.'
author: 'broadsage'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  file:
    description: 'Path to the doko.yaml file'
    required: false
    default: 'doko.yaml'
  tags:
    description: 'List of tags to apply to the generated image'
    required: true
  push:
    description: 'Push the generated image to registry'
    required: false
    default: 'false'
  load:
    description: 'Load the image into the local Docker daemon'
    required: false
    default: 'true'
  builder-version:
    description: 'Version of the Doko BuildKit frontend to use'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Build local Doko frontend
      shell: bash
      run: |
        docker buildx build --tag doko:local --load .

    - name: Build with Doko
      shell: bash
      run: |
        # Inject the custom Doko syntax version requested by the action
        # and trigger standard docker buildx build.
        # Push and Load flags are mutually exclusive in Buildx.
        PUSH_FLAG=""
        if [ "${{ inputs.push }}" = "true" ]; then
          PUSH_FLAG="--push"
        fi

        LOAD_FLAG=""
        if [ "${{ inputs.load }}" = "true" ] && [ "${{ inputs.push }}" != "true" ]; then
          LOAD_FLAG="--load"
        fi

        docker buildx build \
          --file "${{ inputs.file }}" \
          --tag "${{ inputs.tags }}" \
          $PUSH_FLAG \
          $LOAD_FLAG \
          .

