repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(examples/|devenv/|\.github/workflows/)
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: go fmt ./...
        language: system
        files: \.go$
        pass_filenames: false

      - id: task-lint
        name: task lint
        entry: task lint
        language: system
        files: \.go$
        pass_filenames: false

      - id: task-test
        name: task test
        entry: task test
        language: system
        files: \.go$
        pass_filenames: false
