---
name: ✨ Feature Request
description: Suggest a new feature or enhancement for Doko.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate feature ideas! Please describe the problem you're trying to solve and your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a frustration with the current tool?
      placeholder: "I find it difficult to ... because ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like. If possible, include a YAML example showing how it would look in `doko.yaml`.
      placeholder: |
        Add a new `health-check:` field:
        ```yaml
        health-check:
          cmd: ["curl", "-f", "http://localhost:8080/health"]
          interval: 30s
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Affected Area
      description: Which part of Doko does this feature relate to?
      options:
        - "Schema (doko.yaml fields)"
        - "BuildKit / LLB generation"
        - "Package management (apk / providers)"
        - "Security & hardening"
        - "CLI / developer experience"
        - "CI/CD / GitHub Action"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or references (e.g. links to similar tools or specs).
    validations:
      required: false
