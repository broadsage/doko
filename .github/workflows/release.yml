name: Release

on:
  schedule:
    - cron: '0 0 * * 1' # every Monday at 00:00 UTC
  workflow_dispatch:

# Restrict default token permissions at the top level; grant only what each
# job needs via the job-level permissions block.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create tags and GitHub Releases
      packages: write  # push Docker images to ghcr.io
      id-token: write  # cosign keyless signing (OIDC token)

    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Full-depth checkout with credentials so the tag action can push via git.
      # fetch-depth: 0 is needed for git describe / git diff against previous tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check if release is needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags

          TAG=$(git tag --points-at HEAD)
          if [ -n "$TAG" ]; then
            # HEAD is already tagged — check whether a GitHub Release exists.
            RELEASE=$(gh release view "$TAG" --json tagName --jq '.tagName' 2>/dev/null || echo "none")
            if [ "$RELEASE" == "$TAG" ]; then
              echo "Release already exists for $TAG. Skipping."
              echo "need_release=no" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG exists but has no GitHub Release. Creating release."
              echo "need_release=yes" >> "$GITHUB_OUTPUT"
              echo "existing_tag=$TAG" >> "$GITHUB_OUTPUT"
            fi
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              # Only release if Go source, modules, or LICENSE changed.
              CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD \
                | grep -E '(\.go$|^go\.mod$|^go\.sum$|^LICENSE$)' || true)
              if [ -z "$CHANGED" ]; then
                echo "No Go-worthy changes since $LAST_TAG. Skipping release."
                echo "need_release=no" >> "$GITHUB_OUTPUT"
              else
                echo "Found release-worthy changes since $LAST_TAG."
                echo "need_release=yes" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "No previous tags found. Creating first release."
              echo "need_release=yes" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure git
        if: steps.check.outputs.need_release == 'yes' && steps.check.outputs.existing_tag == ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Reads conventional commits since the last tag, determines the next
      # semver bump (feat→minor, fix→patch, feat!→major), and pushes the tag.
      # Uses GITHUB_TOKEN so the tag push does NOT re-trigger this workflow
      # (GitHub suppresses events caused by GITHUB_TOKEN to prevent loops).
      - name: Bump version and push tag
        id: create_tag
        if: steps.check.outputs.need_release == 'yes' && steps.check.outputs.existing_tag == ''
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.OS_RELEASE_GITHUB_TOKEN }}
          fetch_all_tags: true

      # Re-checkout at the new (or existing) tag with full history for GoReleaser.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.check.outputs.need_release == 'yes'
        with:
          persist-credentials: false
          ref: ${{ steps.check.outputs.existing_tag || steps.create_tag.outputs.new_tag }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.check.outputs.need_release == 'yes'
        with:
          go-version-file: './go.mod'
          check-latest: true

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.check.outputs.need_release == 'yes'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        if: steps.check.outputs.need_release == 'yes'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.check.outputs.need_release == 'yes'

      # Cosign keyless signing uses the OIDC token from the workflow run
      # (id-token: write permission above). No private key or secret needed.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.check.outputs.need_release == 'yes'

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: steps.check.outputs.need_release == 'yes'

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        if: steps.check.outputs.need_release == 'yes'
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
