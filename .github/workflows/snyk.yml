name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC

permissions: {}

jobs:
  snyk-go:
    name: snyk go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: './go.mod'
          check-latest: true

      - name: Run Snyk to check Go modules for vulnerabilities
        uses: snyk/actions/golang@12140f4059e244892ae643824a95459a102120dd # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.OS_RELEASE_SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk-go.sarif

      - name: Upload Snyk Go results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: hashFiles('snyk-go.sarif') != ''
        with:
          sarif_file: snyk-go.sarif

  snyk-docker:
    name: snyk docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Docker image for scanning
        run: docker build -t doko:${{ github.sha }} .

      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@12140f4059e244892ae643824a95459a102120dd # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.OS_RELEASE_SNYK_TOKEN }}
        with:
          image: doko:${{ github.sha }}
          args: --file=Dockerfile --sarif-file-output=snyk-docker.sarif

      - name: Upload Snyk Docker results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: hashFiles('snyk-docker.sarif') != ''
        with:
          sarif_file: snyk-docker.sarif
